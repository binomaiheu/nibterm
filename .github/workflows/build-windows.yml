name: Build Windows

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the version hook runs `git describe --tags`.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Build executable
        run: uv run pyinstaller nibterm.spec --noconfirm

      - name: Determine version
        id: version
        run: |
          $describe = (git describe --tags --always).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $base = $env:GITHUB_REF_NAME
          } else {
            $base = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          # NSIS VIProductVersion needs a purely numeric X.Y.Z.W version.
          $parts = @(($base -replace '[^0-9.].*$', '').Split('.') | Where-Object { $_ -ne '' })
          while ($parts.Count -lt 4) { $parts += '0' }
          $num = ($parts[0..3]) -join '.'
          "APP_VERSION=$describe" >> $env:GITHUB_ENV
          "APP_VERSION_NUM=$num" >> $env:GITHUB_ENV
          "artifact=nibterm-windows-$describe" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $describe ($num)"

      - name: Create portable zip
        run: |
          $pkg = "dist/package/nibterm"
          New-Item -ItemType Directory -Force "$pkg/config_example" | Out-Null
          Copy-Item dist/nibterm.exe $pkg
          Copy-Item static/nibterm-icon.ico $pkg
          Copy-Item README.md $pkg
          Copy-Item config_example/* "$pkg/config_example"
          Compress-Archive -Path $pkg -DestinationPath "dist/nibterm-$env:APP_VERSION-windows-x64.zip" -Force

      - name: Install NSIS
        run: |
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "$nsisDir\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          if (Test-Path "$nsisDir\makensis.exe") { $nsisDir >> $env:GITHUB_PATH }

      - name: Build installer
        run: |
          makensis /V3 `
            "/DVERSION=$env:APP_VERSION" `
            "/DVERSION_NUM=$env:APP_VERSION_NUM" `
            "/DSRC_DIR=$PWD\dist\package\nibterm" `
            "/DOUT_FILE=$PWD\dist\nibterm-$env:APP_VERSION-windows-x64-setup.exe" `
            installer\nibterm.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/nibterm-*-windows-x64.zip
            dist/nibterm-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
